{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <link rel="stylesheet" href="{% static 'css/estilos.css' %}">
    <meta charset="UTF-8">
    <title>Restaurante Pasta La Vista</title>
    <style>
        .logout-form {
            margin: 0;
            padding: 0;
            border-top: 1px solid rgba(77, 17, 17, 0.963);
        }
        .logout-form button {
            display: block;
            width: 100%;
            padding: 15px 20px;
            background: none;
            border: none;
            color: white;
            font-family: 'Lato', sans-serif;
            font-weight: 700;
            font-size: 0.9rem;
            text-transform: uppercase;
            text-align: left;
            cursor: pointer;
            letter-spacing: inherit;
            transition: all 0.3s ease;
        }
        .logout-form button:hover {
            color: #f2e0c0;
            padding-left: 30px;
        }
    </style>
</head>
<body>
    <div class="contenedor-principal">
    <aside class="sidebar">
    <header>
        <h1>Pasta La Vista</h1>
        <p>El Final de tu Hambre</p>
    </header>

    <nav class="menu">
        <a href="/">Inicio</a>
        <a href="/clientes/">Clientes</a>
        <a href="/empleados/">Empleados</a>
        <a href="/mesas/">Mesas</a>
        <a href="/platos/">Platos</a>
        <a href="/ordenes/">Órdenes</a>
        <a href="/facturas/">Facturas</a>
        <a href="/admin/">Admin</a>
        <form class="logout-form" method="post" action="/account/logout/">
            {% csrf_token %}
            <button type="submit">Cerrar sesión</button>
        </form>
    </nav>
    </aside>

    <main class="contenedor">
        {% block content %}
        {% endblock %}
    </main>
    </div>
</body>
</html>
