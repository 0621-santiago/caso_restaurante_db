{% extends 'gestion/base.html' %}

{% block content %}
<h2>Panel de Control</h2>

<div class="dashboard-grid">

    
    <a href="{% url 'lista_clientes' %}">
        <div class="card">
            <h3>Clientes</h3>
            <p style="font-size:2rem; font-weight:bold;">{{ total_clientes }}</p>
        </div>
    </a>

    <a href="{% url 'lista_empleados' %}">
        <div class="card">
            <h3>Empleados</h3>
            <p style="font-size:2rem; font-weight:bold;">{{ total_empleados }}</p>
        </div>
    </a>

    <a href="{% url 'lista_mesas' %}">
        <div class="card">
            <h3>Mesas</h3>
            <p style="font-size:2rem; font-weight:bold;">{{ total_mesa }}</p>
        </div>
    </a>

    <a href="{% url 'lista_platos' %}">
        <div class="card">
            <h3>Platos</h3>
            <p style="font-size:2rem; font-weight:bold;">{{ total_plato }}</p>
        </div>
    </a>

    <a href="{% url 'lista_ordenes' %}">
        <div class="card">
            <h3>Órdenes</h3>
            <p style="font-size:2rem; font-weight:bold;">{{ total_orden }}</p>
        </div>
    </a>

    <a href="{% url 'lista_facturas' %}">
        <div class="card">
            <h3>Facturas</h3>
            <p style="font-size:2rem; font-weight:bold;">{{ total_factura }}</p>
        </div>
    </a>

</div>
{% endblock %}
